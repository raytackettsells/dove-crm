<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dove &amp; Robin Recovery — Referral CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #2c5f7c;
    --primary-light: #3a7ca5;
    --primary-dark: #1e4258;
    --accent: #5ba89d;
    --accent-light: #7bc4b9;
    --bg: #f4f7f9;
    --card: #ffffff;
    --text: #2d3748;
    --text-light: #718096;
    --border: #e2e8f0;
    --danger: #c53030;
    --danger-light: #feb2b2;
    --success: #276749;
    --success-light: #c6f6d5;
    --warning: #c05621;
    --warning-light: #feebc8;
    --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  /* ---- Login Screen ---- */
  .login-screen {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--accent) 100%);
  }
  .login-box {
    background:var(--card); border-radius:14px; padding:40px 36px; width:420px; max-width:92vw;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .login-box h1 { font-size:22px; margin-bottom:4px; color:var(--primary-dark); }
  .login-box .subtitle { font-size:13px; color:var(--text-light); margin-bottom:28px; }
  .login-box .tabs { display:flex; gap:0; margin-bottom:24px; border-bottom:2px solid var(--border); }
  .login-box .tabs button {
    flex:1; padding:10px; background:none; border:none; font-size:14px; font-weight:600;
    color:var(--text-light); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px;
  }
  .login-box .tabs button.active { color:var(--primary); border-bottom-color:var(--primary); }
  .login-box .form-group { margin-bottom:14px; }
  .login-box .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
  .login-box input, .login-box select {
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; outline:none; transition:border .2s;
  }
  .login-box input:focus { border-color:var(--primary); }
  .btn-login {
    width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:8px;
    font-size:15px; font-weight:600; cursor:pointer; margin-top:8px;
  }
  .btn-login:hover { background:var(--primary-light); }
  .login-error { display:none; padding:10px; background:var(--danger-light); color:var(--danger);
    border-radius:8px; font-size:13px; margin-top:10px; }

  /* ---- App Layout ---- */
  .app-layout { display:none; min-height:100vh; }
  .sidebar {
    width:240px; background:var(--primary-dark); color:#fff; display:flex; flex-direction:column;
    position:fixed; top:0; left:0; bottom:0; z-index:100;
  }
  .sidebar-header { padding:20px 18px 12px; border-bottom:1px solid rgba(255,255,255,.1); }
  .sidebar-header h2 { font-size:16px; font-weight:700; }
  .sidebar-header .user-name { font-size:12px; opacity:.7; margin-top:4px; }
  .sidebar nav { flex:1; padding:12px 0; }
  .sidebar nav button {
    width:100%; text-align:left; padding:11px 18px; background:none; border:none;
    color:rgba(255,255,255,.7); font-size:14px; cursor:pointer; transition:all .15s;
  }
  .sidebar nav button:hover { background:rgba(255,255,255,.08); color:#fff; }
  .sidebar nav button.active { background:rgba(255,255,255,.15); color:#fff; font-weight:600; }
  .sidebar-footer { padding:12px 18px; border-top:1px solid rgba(255,255,255,.1); }
  .sidebar-footer button {
    width:100%; padding:8px; background:rgba(255,255,255,.1); border:none; border-radius:6px;
    color:#fff; font-size:13px; cursor:pointer;
  }
  .sidebar-footer button:hover { background:rgba(255,255,255,.2); }

  .main-area { margin-left:240px; flex:1; display:flex; flex-direction:column; min-height:100vh; }
  .top-bar {
    padding:16px 28px; background:var(--card); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:var(--shadow);
  }
  .top-bar h1 { font-size:20px; color:var(--primary-dark); }
  .content { padding:24px 28px; flex:1; }

  /* ---- Buttons ---- */
  .btn { padding:8px 16px; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover { background:var(--primary-light); }
  .btn-accent { background:var(--accent); color:#fff; }
  .btn-accent:hover { background:var(--accent-light); }
  .btn-outline { background:#fff; color:var(--text); border:1px solid var(--border); }
  .btn-outline:hover { background:var(--bg); }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-danger:hover { opacity:.9; }
  .btn-sm { padding:5px 10px; font-size:12px; }

  /* ---- Table Card ---- */
  .table-card { background:var(--card); border-radius:10px; box-shadow:var(--shadow); overflow:hidden; }
  .table-toolbar {
    padding:14px 18px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border);
  }
  .table-toolbar input {
    padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px;
    width:260px; outline:none;
  }
  .table-toolbar input:focus { border-color:var(--primary); }
  .spacer { flex:1; }
  table { width:100%; border-collapse:collapse; }
  th { background:var(--bg); padding:10px 14px; text-align:left; font-size:12px; font-weight:700;
    text-transform:uppercase; color:var(--text-light); cursor:pointer; user-select:none; letter-spacing:.3px; }
  th:hover { color:var(--primary); }
  td { padding:10px 14px; border-top:1px solid var(--border); font-size:13px; }
  tr:hover td { background:rgba(44,95,124,.03); }
  .actions-cell { white-space:nowrap; display:flex; gap:4px; }
  .empty-state { text-align:center; padding:40px 20px !important; }
  .empty-state p { color:var(--text-light); font-size:14px; }

  /* ---- Dashboard Cards ---- */
  .dash-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
  .dash-card {
    background:var(--card); border-radius:10px; padding:20px; box-shadow:var(--shadow); text-align:center;
  }
  .dash-card .number { font-size:32px; font-weight:700; color:var(--primary); }
  .dash-card .label { font-size:13px; color:var(--text-light); margin-top:4px; }
  .dash-date-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .dash-date-bar input[type=date] {
    padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px;
  }
  .dash-date-bar .quick-btn {
    padding:5px 12px; border:1px solid var(--border); border-radius:6px; background:#fff;
    font-size:12px; cursor:pointer; color:var(--text);
  }
  .dash-date-bar .quick-btn:hover { background:var(--bg); }
  .count-table { width:100%; border-collapse:collapse; margin-top:8px; }
  .count-table td { padding:6px 10px; border-top:1px solid var(--border); font-size:13px; }
  .count-table td:last-child { text-align:right; font-weight:600; }
  .count-section { background:var(--card); border-radius:10px; padding:18px; box-shadow:var(--shadow); margin-bottom:20px; }
  .count-section h3 { font-size:14px; margin-bottom:6px; color:var(--primary-dark); }

  /* ---- Modal ---- */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center;
    justify-content:center; z-index:1000;
  }
  .modal-overlay.open { display:flex; }
  .modal-box {
    background:var(--card); border-radius:12px; width:520px; max-width:94vw; max-height:90vh;
    overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-header { padding:18px 22px; border-bottom:1px solid var(--border); font-size:16px; font-weight:700; }
  .modal-body { padding:22px; }
  .modal-body .form-group { margin-bottom:14px; }
  .modal-body .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
  .modal-body input, .modal-body select, .modal-body textarea {
    width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; outline:none;
  }
  .modal-body textarea { min-height:80px; resize:vertical; font-family:inherit; }
  .modal-footer { padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; }

  /* ---- Toast ---- */
  #toasts { position:fixed; top:20px; right:20px; z-index:2000; display:flex; flex-direction:column; gap:8px; }
  .toast {
    padding:12px 20px; border-radius:8px; font-size:13px; font-weight:600; color:#fff;
    animation: slideIn .3s ease;
  }
  .toast-success { background:var(--success); }
  .toast-error { background:var(--danger); }
  @keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }

  .loading-spinner {
    display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ---- View Modal Detail ---- */
  .detail-row { display:flex; padding:8px 0; border-bottom:1px solid var(--border); }
  .detail-label { width:130px; font-size:13px; font-weight:600; color:var(--text-light); }
  .detail-value { flex:1; font-size:14px; }
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>Dove &amp; Robin Recovery</h1>
    <p class="subtitle">Referral Management CRM</p>
    <div class="tabs">
      <button class="active" onclick="switchAuthTab('login')">Sign In</button>
      <button onclick="switchAuthTab('signup')">Create Account</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group"><label>Email</label>
        <input type="email" id="loginEmail" required placeholder="you@doverecovery.com"/>
      </div>
      <div class="form-group"><label>Password</label>
        <input type="password" id="loginPassword" required placeholder="Your password"/>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
      <div class="login-error" id="loginError"></div>
    </form>

    <form id="signupForm" style="display:none" onsubmit="handleSignup(event)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px;">
        <div class="form-group"><label>First Name</label><input id="signupFirst" required/></div>
        <div class="form-group"><label>Last Name</label><input id="signupLast" required/></div>
      </div>
      <div class="form-group"><label>Email</label>
        <input type="email" id="signupEmail" required placeholder="you@doverecovery.com"/>
      </div>
      <div class="form-group"><label>Password</label>
        <input type="password" id="signupPassword" required minlength="6" placeholder="At least 6 characters"/>
      </div>
      <button type="submit" class="btn-login" id="signupBtn">Create Account</button>
      <div class="login-error" id="signupError"></div>
    </form>
  </div>
</div>

<!-- ============ APP SCREEN ============ -->
<div class="app-layout" id="appScreen">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Dove &amp; Robin Recovery</h2>
      <div class="user-name" id="sidebarUserName"></div>
    </div>
    <nav>
      <button class="active" onclick="showPage('dashboard')">Dashboard</button>
      <button onclick="showPage('inbound')">Inbound Referrals</button>
      <button onclick="showPage('outbound')">Outbound Referrals</button>
      <button onclick="showPage('team')">Team</button>
      <a href="https://doverobin.netlify.app" style="display:block;width:100%;padding:10px 18px;background:none;border:none;color:rgba(255,255,255,.65);font-size:14px;text-align:left;cursor:pointer;text-decoration:none;transition:all .15s;border-top:1px solid rgba(255,255,255,.08);margin-top:8px;padding-top:14px">📋 Admissions</a>
    </nav>
    <div class="sidebar-footer">
      <button onclick="handleLogout()">Sign Out</button>
    </div>
  </aside>

  <div class="main-area">
    <div class="top-bar">
      <h1 id="pageTitle">Dashboard</h1>
      <div id="topActions"></div>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
// ============================================================
// CONFIGURATION — Replace these with your Supabase project values
// ============================================================
const SUPABASE_URL  = 'https://xhkgazlmudfwfnjqwgqo.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhoa2dhemxtdWRmd2ZuanF3Z3FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTQ5OTIsImV4cCI6MjA5NDI3MDk5Mn0.wxcHpFlRSy2u51RNvF5Hd8hv2sIkYet98L_PR6CgsDc';
// ============================================================

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// Role options
const ROLES = ['Admissions Coordinator', 'Business Development', 'Manager'];
// Inbound referral type options
const REFERRAL_TYPES = ['New Referral', 'Alumni', 'Detox Return'];

let currentUser = null;
let currentProfile = null;
let profiles = [];
let inboundData = [];
let outboundData = [];
let referralSources = [];
let currentPage = 'dashboard';
let sortCol = 'created_at';
let sortDir = 'desc';
let searchText = '';

// ===================== AUTH =====================
function switchAuthTab(tab) {
  document.querySelectorAll('.login-box .tabs button').forEach(b => b.classList.remove('active'));
  if (tab === 'login') {
    document.querySelector('.login-box .tabs button:first-child').classList.add('active');
    document.getElementById('loginForm').style.display = '';
    document.getElementById('signupForm').style.display = 'none';
  } else {
    document.querySelector('.login-box .tabs button:last-child').classList.add('active');
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('signupForm').style.display = '';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span>';
  err.style.display = 'none';

  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById('loginEmail').value.trim(),
    password: document.getElementById('loginPassword').value
  });

  btn.disabled = false; btn.textContent = 'Sign In';
  if (error) { err.textContent = error.message; err.style.display = 'block'; return; }
  await initApp(data.user);
}

async function handleSignup(e) {
  e.preventDefault();
  const btn = document.getElementById('signupBtn');
  const err = document.getElementById('signupError');
  btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span>';
  err.style.display = 'none';

  const firstName = document.getElementById('signupFirst').value.trim();
  const lastName = document.getElementById('signupLast').value.trim();

  const { data, error } = await sb.auth.signUp({
    email: document.getElementById('signupEmail').value.trim(),
    password: document.getElementById('signupPassword').value,
    options: { data: { first_name: firstName, last_name: lastName } }
  });

  btn.disabled = false; btn.textContent = 'Create Account';
  if (error) { err.textContent = error.message; err.style.display = 'block'; return; }

  if (data.user && !data.session) {
    err.textContent = 'Check your email for a confirmation link, then sign in.';
    err.style.display = 'block';
    err.style.color = 'var(--success)';
    return;
  }
  await initApp(data.user);
}

async function handleLogout() {
  await sb.auth.signOut();
  currentUser = null; currentProfile = null;
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = '';
}

// ===================== APP INIT =====================
async function initApp(user) {
  currentUser = user;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';

  const { data: prof } = await sb.from('profiles').select('*').eq('id', user.id).single();
  currentProfile = prof;
  document.getElementById('sidebarUserName').textContent =
    (prof?.first_name || '') + ' ' + (prof?.last_name || '') || user.email;

  await loadAllData();
  showPage('dashboard');
}

// Fetch all rows from a table using pagination (Supabase caps at 1000 per request)
async function fetchAll(query) {
  let allData = [];
  let from = 0;
  const pageSize = 1000;
  while (true) {
    const { data, error } = await query.range(from, from + pageSize - 1);
    if (error) { console.error(error); break; }
    if (!data || data.length === 0) break;
    allData = allData.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
  }
  return allData;
}

async function loadAllData() {
  const [p, i, o, s] = await Promise.all([
    fetchAll(sb.from('profiles').select('*').order('created_at')),
    fetchAll(sb.from('inbound_referrals').select('*, profiles:created_by(first_name, last_name)').order('created_at', { ascending: false })),
    fetchAll(sb.from('outbound_referrals').select('*, profiles:created_by(first_name, last_name)').order('created_at', { ascending: false })),
    fetchAll(sb.from('referral_sources').select('*').order('name'))
  ]);

  profiles = p || [];
  inboundData = (i || []).map(r => ({
    ...r,
    created_by_name: r.profiles ? r.profiles.first_name + ' ' + r.profiles.last_name : '—'
  }));
  outboundData = (o || []).map(r => ({
    ...r,
    created_by_name: r.profiles ? r.profiles.first_name + ' ' + r.profiles.last_name : '—'
  }));
  referralSources = (s || []).map(x => x.name);
}

// ===================== NAVIGATION =====================
function showPage(page) {
  currentPage = page;
  searchText = '';
  sortCol = 'created_at';
  sortDir = 'desc';
  document.querySelectorAll('.sidebar nav button').forEach(b => b.classList.remove('active'));
  const labels = { dashboard:'Dashboard', inbound:'Inbound Referrals', outbound:'Outbound Referrals', team:'Team' };
  document.getElementById('pageTitle').textContent = labels[page] || '';
  document.querySelectorAll('.sidebar nav button').forEach((b,idx) => {
    const pages = ['dashboard','inbound','outbound','team'];
    if (pages[idx] === page) b.classList.add('active');
  });
  renderPage();
}

function renderPage() {
  const c = document.getElementById('pageContent');
  const a = document.getElementById('topActions');
  a.innerHTML = '';
  if (currentPage === 'dashboard') renderDashboard(c);
  else if (currentPage === 'inbound') renderReferrals(c, a, 'inbound');
  else if (currentPage === 'outbound') renderReferrals(c, a, 'outbound');
  else if (currentPage === 'team') renderTeam(c, a);
}

// ===================== DASHBOARD =====================
// Default date range: last 7 days
let dashStartDate = '';
let dashEndDate = '';

function initDashDates() {
  const now = new Date();
  const weekAgo = new Date(now);
  weekAgo.setDate(weekAgo.getDate() - 6);
  dashEndDate = now.toISOString().slice(0,10);
  dashStartDate = weekAgo.toISOString().slice(0,10);
}
initDashDates();

function filterByDateRange(data) {
  return data.filter(r => {
    if (!r.created_at) return false;
    const d = r.created_at.slice(0,10);
    return d >= dashStartDate && d <= dashEndDate;
  });
}

function countByField(data, field) {
  const counts = {};
  data.forEach(r => {
    const val = r[field] || '(blank)';
    counts[val] = (counts[val] || 0) + 1;
  });
  return Object.entries(counts).sort((a,b) => b[1] - a[1]);
}

function updateDashDates() {
  const s = document.getElementById('dashStart').value;
  const e = document.getElementById('dashEnd').value;
  if (s) dashStartDate = s;
  if (e) dashEndDate = e;
  renderPage();
}

function setQuickRange(days) {
  const now = new Date();
  const past = new Date(now);
  past.setDate(past.getDate() - (days - 1));
  dashEndDate = now.toISOString().slice(0,10);
  dashStartDate = past.toISOString().slice(0,10);
  renderPage();
}

function renderDashboard(c) {
  const today = new Date().toISOString().slice(0,10);
  const inFiltered = filterByDateRange(inboundData);
  const outFiltered = filterByDateRange(outboundData);

  const inToday = inboundData.filter(r => r.created_at && r.created_at.slice(0,10) === today).length;
  const outToday = outboundData.filter(r => r.created_at && r.created_at.slice(0,10) === today).length;

  const sourceCounts = countByField(inFiltered, 'referral_source');
  const referredToCounts = countByField(outFiltered, 'referred_to');
  const reasonCounts = countByField(outFiltered, 'reason');

  function countTable(rows) {
    if (!rows.length) return '<p style="font-size:13px;color:var(--text-light);padding:8px 0;">No data in this range.</p>';
    return `<table class="count-table">${rows.map(([name,cnt]) =>
      `<tr><td>${esc(name)}</td><td>${cnt}</td></tr>`).join('')}</table>`;
  }

  c.innerHTML = `
    <div class="dash-date-bar">
      <label style="font-size:13px;font-weight:600;">Date Range:</label>
      <input type="date" id="dashStart" value="${dashStartDate}" onchange="updateDashDates()"/>
      <span style="font-size:13px;">to</span>
      <input type="date" id="dashEnd" value="${dashEndDate}" onchange="updateDashDates()"/>
      <button class="quick-btn" onclick="setQuickRange(7)">7 Days</button>
      <button class="quick-btn" onclick="setQuickRange(30)">30 Days</button>
      <button class="quick-btn" onclick="setQuickRange(90)">90 Days</button>
      <button class="quick-btn" onclick="setQuickRange(365)">1 Year</button>
    </div>

    <div class="dash-grid">
      <div class="dash-card">
        <div class="number">${inFiltered.length}</div>
        <div class="label">Inbound (Date Range)</div>

// ===================== REFERRALS TABLE =====================
function renderReferrals(c, a, type) {
  const isOut = type === 'outbound';
  const label = isOut ? 'Outbound' : 'Inbound';
  const data = isOut ? outboundData : inboundData;

  a.innerHTML = `
    <div style="display:flex;gap:8px;">
      <button class="btn btn-outline btn-sm" onclick="exportCSV('${type}')">Export CSV</button>
      <button class="btn ${isOut?'btn-accent':'btn-primary'} btn-sm" onclick="openReferralModal('${type}')">+ New ${label}</button>
    </div>`;

  let filtered = data.filter(r => {
    if (!searchText) return true;
    const s = searchText.toLowerCase();
    return (r.first_name+' '+r.last_name).toLowerCase().includes(s)
      || (r.referral_source||'').toLowerCase().includes(s)
      || (r.referred_to||'').toLowerCase().includes(s)
      || (r.reason||'').toLowerCase().includes(s)
      || (r.created_by_name||'').toLowerCase().includes(s);
  });

  filtered.sort((a,b) => {
    let va = a[sortCol]||'', vb = b[sortCol]||'';
    if (sortCol==='created_at') { va=new Date(va); vb=new Date(vb); }
    else { va=String(va).toLowerCase(); vb=String(vb).toLowerCase(); }
    if (va<vb) return sortDir==='asc'?-1:1;
    if (va>vb) return sortDir==='asc'?1:-1;
    return 0;
  });

  const arrow = col => sortCol===col?(sortDir==='asc'?'&#9650;':'&#9660;'):'';

  c.innerHTML = `
    <div class="table-card">
      <div class="table-toolbar">
        <input type="text" id="searchInput" placeholder="Search referrals..." value="${esc(searchText)}" oninput="searchText=this.value;filterTable('${type}')"/>
        <span id="filterCount" style="font-size:13px;color:var(--text-light)">${filtered.length} referral${filtered.length!==1?'s':''}</span>
        <div class="spacer"></div>
      </div>
      <table>
        <thead><tr>
          <th onclick="toggleSort('first_name')">Name ${arrow('first_name')}</th>
          <th onclick="toggleSort('created_at')">Date / Time ${arrow('created_at')}</th>
          ${isOut
            ? `<th onclick="toggleSort('referred_to')">Referred To ${arrow('referred_to')}</th>
               <th onclick="toggleSort('reason')">Reason ${arrow('reason')}</th>`
            : `<th onclick="toggleSort('referral_source')">Source ${arrow('referral_source')}</th>
               <th onclick="toggleSort('referral_type')">Type ${arrow('referral_type')}</th>`}
          <th onclick="toggleSort('created_by_name')">Created By ${arrow('created_by_name')}</th>
          <th>Actions</th>
        </tr></thead>
        <tbody id="referralTableBody">
          ${filtered.length ? filtered.map(r => renderReferralRow(r, type, isOut)).join('')
          : `<tr><td colspan="${isOut?6:6}" class="empty-state"><p>No ${label.toLowerCase()} referrals yet. Click "+ New" to add one.</p></td></tr>`}
        </tbody>
      </table>
    </div>`;
}

function renderReferralRow(r, type, isOut) {
  return `<tr>
    <td><strong>${esc(r.first_name)} ${esc(r.last_name)}</strong></td>
    <td>${fmtDate(r.created_at)}</td>
    ${isOut
      ? `<td>${esc(r.referred_to)}</td><td>${esc(r.reason||'—')}</td>`
      : `<td>${esc(r.referral_source)}</td><td>${esc(r.referral_type||'—')}</td>`}
    <td>${esc(r.created_by_name)}</td>
    <td class="actions-cell">
      <button class="btn btn-outline btn-sm" onclick="viewReferral('${type}',${r.id})">View</button>
      <button class="btn btn-outline btn-sm" onclick="openReferralModal('${type}',${r.id})">Edit</button>
      <button class="btn btn-danger btn-sm" onclick="deleteReferral('${type}',${r.id})">Del</button>
    </td>
  </tr>`;
}

// This function updates ONLY the table body and count — keeps search input focused
function filterTable(type) {
  const isOut = type === 'outbound';
  const label = isOut ? 'Outbound' : 'Inbound';
  const data = isOut ? outboundData : inboundData;

  let filtered = data.filter(r => {
    if (!searchText) return true;
    const s = searchText.toLowerCase();
    return (r.first_name+' '+r.last_name).toLowerCase().includes(s)
      || (r.referral_source||'').toLowerCase().includes(s)
      || (r.referred_to||'').toLowerCase().includes(s)
      || (r.reason||'').toLowerCase().includes(s)
      || (r.created_by_name||'').toLowerCase().includes(s);
  });

  filtered.sort((a,b) => {
    let va = a[sortCol]||'', vb = b[sortCol]||'';
    if (sortCol==='created_at') { va=new Date(va); vb=new Date(vb); }
    else { va=String(va).toLowerCase(); vb=String(vb).toLowerCase(); }
    if (va<vb) return sortDir==='asc'?-1:1;
    if (va>vb) return sortDir==='asc'?1:-1;
    return 0;
  });

  const tbody = document.getElementById('referralTableBody');
  if (tbody) {
    tbody.innerHTML = filtered.length
      ? filtered.map(r => renderReferralRow(r, type, isOut)).join('')
      : `<tr><td colspan="6" class="empty-state"><p>No ${label.toLowerCase()} referrals found.</p></td></tr>`;
  }

  const countSpan = document.getElementById('filterCount');
  if (countSpan) {
    countSpan.textContent = filtered.length + ' referral' + (filtered.length !== 1 ? 's' : '');
  }
}

function toggleSort(col) {
  if (sortCol===col) sortDir = sortDir==='asc'?'desc':'asc';
  else { sortCol=col; sortDir='asc'; }
  renderPage();
}

// ===================== REFERRAL SOURCE DROPDOWN =====================
function sourceOptions(selectedValue) {
  let opts = '<option value="">— Select —</option>';
  referralSources.forEach(name => {
    const sel = name === selectedValue ? ' selected' : '';
    opts += `<option value="${esc(name)}"${sel}>${esc(name)}</option>`;
  });
  opts += '<option value="__ADD_NEW__">+ Add New Source...</option>';
  return opts;
}

function handleSourceChange(selectEl) {
  const addNewRow = document.getElementById('addNewSourceRow');
  if (selectEl.value === '__ADD_NEW__') {
    addNewRow.style.display = 'flex';
    document.getElementById('newSourceInput').focus();
  } else {
    addNewRow.style.display = 'none';
  }
}

async function addNewSource() {
  const input = document.getElementById('newSourceInput');
  const name = input.value.trim();
  if (!name) { toast('Please enter a source name', 'error'); return; }

  if (referralSources.some(s => s.toLowerCase() === name.toLowerCase())) {
    toast('That source already exists', 'error');
    return;
  }

  const { error } = await sb.from('referral_sources').insert({ name });
  if (error) { toast(error.message, 'error'); return; }

  const { data } = await sb.from('referral_sources').select('*').order('name');
  referralSources = (data || []).map(x => x.name);

  const select = document.getElementById('rf_src');
  select.innerHTML = sourceOptions(name);
  select.value = name;
  document.getElementById('addNewSourceRow').style.display = 'none';
  toast('Source added!');
}

// ===================== REFERRAL MODALS =====================
function openReferralModal(type, editId) {
  const isOut = type === 'outbound';
  const label = isOut ? 'Outbound' : 'Inbound';
  const data = isOut ? outboundData : inboundData;
  const existing = editId ? data.find(r => r.id === editId) : null;

  let body = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px;">
      <div class="form-group"><label>First Name</label><input id="rf_fn" value="${esc(existing?.first_name||'')}"/></div>
      <div class="form-group"><label>Last Name</label><input id="rf_ln" value="${esc(existing?.last_name||'')}"/></div>
    </div>`;

  if (isOut) {
    body += `
      <div class="form-group">
        <label>Referred To</label>
        <select id="rf_src" onchange="handleSourceChange(this)">
          ${sourceOptions(existing?.referred_to||'')}
        </select>
        <div id="addNewSourceRow" style="display:none;gap:8px;margin-top:8px;align-items:center;">
          <input id="newSourceInput" placeholder="New source name" style="flex:1"/>
          <button class="btn btn-primary btn-sm" type="button" onclick="addNewSource()">Add</button>
        </div>
      </div>
      <div class="form-group"><label>Reason for Referral</label><textarea id="rf_reason">${esc(existing?.reason||'')}</textarea></div>`;
  } else {
    const typeOpts = REFERRAL_TYPES.map(t =>
      `<option value="${esc(t)}"${(existing?.referral_type||'')===t?' selected':''}>${esc(t)}</option>`
    ).join('');
    body += `
      <div class="form-group">
        <label>Referral Source</label>
        <select id="rf_src" onchange="handleSourceChange(this)">
          ${sourceOptions(existing?.referral_source||'')}
        </select>
        <div id="addNewSourceRow" style="display:none;gap:8px;margin-top:8px;align-items:center;">
          <input id="newSourceInput" placeholder="New source name" style="flex:1"/>
          <button class="btn btn-primary btn-sm" type="button" onclick="addNewSource()">Add</button>
        </div>
      </div>
      <div class="form-group">
        <label>Referral Type</label>
        <select id="rf_type">
          <option value="">— Select —</option>
          ${typeOpts}
        </select>
      </div>`;
  }

  const saveLabel = existing ? 'Save Changes' : 'Add ' + label;
  openModal((existing ? 'Edit ' : 'New ') + label + ' Referral', body,
    `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" id="saveRefBtn" onclick="saveReferral('${type}',${editId||'null'})">${saveLabel}</button>`);
}

async function saveReferral(type, editId) {
  const isOut = type === 'outbound';
  const fn = document.getElementById('rf_fn').value.trim();
  const ln = document.getElementById('rf_ln').value.trim();
  const srcSelect = document.getElementById('rf_src');
  const srcVal = srcSelect.value === '__ADD_NEW__' ? '' : srcSelect.value;

  if (!fn || !ln) { toast('Name is required', 'error'); return; }
  if (!srcVal) { toast('Please select a ' + (isOut ? 'referred to' : 'source'), 'error'); return; }

  const btn = document.getElementById('saveRefBtn');
  btn.disabled = true;

  let record;
  if (isOut) {
    const reason = document.getElementById('rf_reason').value.trim();
    record = { first_name: fn, last_name: ln, referred_to: srcVal, reason };
  } else {
    const refType = document.getElementById('rf_type').value;
    record = { first_name: fn, last_name: ln, referral_source: srcVal, referral_type: refType };
  }

  const table = isOut ? 'outbound_referrals' : 'inbound_referrals';

  let error;
  if (editId) {
    ({ error } = await sb.from(table).update(record).eq('id', editId));
  } else {
    record.created_by = currentUser.id;
    ({ error } = await sb.from(table).insert(record));
  }

  if (error) { toast(error.message, 'error'); btn.disabled = false; return; }
  await loadAllData();
  closeModal();
  toast(editId ? 'Referral updated' : 'Referral added');
  renderPage();
}

async function deleteReferral(type, id) {
  if (!confirm('Delete this referral? This cannot be undone.')) return;
  const table = type === 'outbound' ? 'outbound_referrals' : 'inbound_referrals';
  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) { toast(error.message, 'error'); return; }
  await loadAllData();
  toast('Referral deleted');
  renderPage();
}

function viewReferral(type, id) {
  const isOut = type === 'outbound';
  const data = isOut ? outboundData : inboundData;
  const r = data.find(x => x.id === id);
  if (!r) return;

  let body = `
    <div class="detail-row"><div class="detail-label">Name</div><div class="detail-value">${esc(r.first_name)} ${esc(r.last_name)}</div></div>
    <div class="detail-row"><div class="detail-label">Date / Time</div><div class="detail-value">${fmtDate(r.created_at)}</div></div>`;

  if (isOut) {
    body += `
      <div class="detail-row"><div class="detail-label">Referred To</div><div class="detail-value">${esc(r.referred_to)}</div></div>
      <div class="detail-row"><div class="detail-label">Reason</div><div class="detail-value">${esc(r.reason||'—')}</div></div>`;
  } else {
    body += `
      <div class="detail-row"><div class="detail-label">Source</div><div class="detail-value">${esc(r.referral_source)}</div></div>
      <div class="detail-row"><div class="detail-label">Type</div><div class="detail-value">${esc(r.referral_type||'—')}</div></div>`;
  }

  body += `<div class="detail-row"><div class="detail-label">Created By</div><div class="detail-value">${esc(r.created_by_name)}</div></div>`;

  openModal('Referral Details', body,
    `<button class="btn btn-outline" onclick="closeModal()">Close</button>
     <button class="btn btn-primary" onclick="closeModal();openReferralModal('${type}',${r.id})">Edit</button>`);
}

async function saveProfile(uid) {

  const role = document.getElementById('ep_role').value;
  if (!fn || !ln) { toast('Name is required', 'error'); return; }

  await loadAllData();

  closeModal(); toast('Profile updated'); renderPage();
}

// ===================== CSV EXPORT =====================
function exportCSV(type) {
  const isOut = type === 'outbound';
  const data = isOut ? outboundData : inboundData;
  let headers = ['First Name', 'Last Name', 'Created Date', 'Created By'];
  if (isOut) headers.splice(2, 0, 'Referred To', 'Reason');
  else headers.splice(2, 0, 'Referral Source', 'Referral Type');

  let rows = [headers.join(',')];
  data.forEach(r => {
    let row = [r.first_name, r.last_name];
    if (isOut) { row.push(r.referred_to, r.reason || ''); }
    else { row.push(r.referral_source, r.referral_type || ''); }
    row.push(r.created_at, r.created_by_name || '');
    rows.push(row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(','));
  });
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = type + '_referrals_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
  toast('CSV exported');
}

// ===================== UTILITIES =====================
function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = footerHtml;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
    + ' ' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}
